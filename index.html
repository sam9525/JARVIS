<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Blocks exfiltration from unsanitized note HTML (Preview renders
         marked output raw). ws://localhost:* is for Vite HMR in dev.
         'wasm-unsafe-eval' is WASM compilation only — hand tracking (v0.3.3).
         ponytail: 'unsafe-inline' styles + local ws stay allowed in prod;
         tighten via a dev/prod template if that ever matters. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: ws://localhost:*"
    />
    <title>JARVIS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
